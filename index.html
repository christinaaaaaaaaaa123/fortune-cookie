<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8ee">
  <title>Your Fortune Cookie 🥠</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(145deg, #fff4df, #f9e5cb);
      color: #493526;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .cookie {
      font-size: 66px;
      margin-bottom: 8px;
      animation: appear 0.5s ease;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
      color: #744523;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      color: #92755f;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #ecd6b9;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 12px 35px rgba(105, 67, 33, 0.10);
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #b18454;
      margin-bottom: 18px;
    }

    #fortune {
      font-size: 24px;
      line-height: 1.55;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider {
      width: 55px;
      height: 2px;
      background: #e6c79e;
      margin: 24px auto;
    }

    .lucky-title {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #947258;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    #numbers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .number {
      width: 39px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f5e4cc;
      color: #80502c;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #e8cda9;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px 18px;
      border: none;
      border-radius: 30px;
      background: #98643c;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #774a2b;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: #9a806a;
      margin-top: 22px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 28px;
      }

      #fortune {
        font-size: 21px;
      }

      .card {
        padding: 25px 16px;
      }
    }
  </style>
</head>
