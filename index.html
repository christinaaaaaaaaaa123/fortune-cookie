
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Fortune Cookie 🥠</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 18px;
  font-family: Georgia, serif;
  color: #65401f;
  text-align: center;
  background:
    radial-gradient(ellipse at top, #fff7e9, transparent 70%),
    linear-gradient(135deg, #fff0d9, #ffebcf);
}

.container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
}

.cookie {
  font-family: Georgia, serif;
  font-size: 76px;
  line-height: 1.2;
  margin: 0 auto 12px;
  filter: drop-shadow(0 5px 4px #b98a4c35);
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(30px, 7vw, 43px);
  line-height: 1.2;
  margin: 10px 0 14px;
  font-weight: bold;
  color: #74421f;
}

.subtitle {
  font-size: 17px;
  line-height: 1.6;
  color: #997354;
  margin-bottom: 42px;
}

.paper {
  position: relative;
  overflow: hidden;
  padding: 44px 22px 38px;
  margin-bottom: 38px;
  background:
    radial-gradient(ellipse at 15% 25%, #d9c5a3 0.6px, transparent 1px),
    radial-gradient(ellipse at 75% 65%, #d9c5a3 0.7px, transparent 1.2px),
    linear-gradient(100deg, #fffaf0, #f8edda, #fff9ee);
  background-size: 13px 15px, 17px 19px, auto;
  border: 1px solid #e2cba7;
  border-radius: 5px;
  box-shadow: 0 9px 18px #8b62302b;
}

.paper::before,
.paper::after {
  content: "";
  position: absolute;
  left: 0;
  width: 88px;
  height: 25px;
  background: #2858a4;
}

.paper::before {
  top: 0;
}

.paper::after {
  bottom: 0;
}

#fortune {
  position: relative;
  z-index: 1;
  font-family: Georgia, serif;
  font-size: clamp(20px, 4.8vw, 29px);
  line-height: 1.55;
  color: #174b9a;
  margin: 0 0 24px;
}

.lucky {
  position: relative;
  z-index: 1;
  font-family: Georgia, serif;
  color: #174b9a;
  font-size: clamp(16px, 4vw, 22px);
  line-height: 1.6;
  margin: 0;
}

button {
  display: block;
  width: min(100%, 440px);
  margin: 0 auto;
  padding: 20px 16px;
  border: 1px solid #e6b35f;
  border-radius: 15px;
  background: linear-gradient(110deg, #ffcf78, #f5b94f);
  box-shadow: 0 7px 13px #8b623035;
  color: #704019;
  font-family: Georgia, serif;
  font-size: clamp(15px, 3.5vw, 19px);
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 18px #8b623040;
}

button:active {
  transform: scale(0.98);
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 36px auto 22px;
  color: #c28b45;
  font-size: 29px;
}

.divider::before,
.divider::after {
  content: "";
  width: 90px;
  height: 1px;
  background: #c28b45;
}

.footer {
  color: #997354;
  font-family: Georgia, serif;
  font-size: 18px;
  line-height: 1.7;
  margin: 0 auto;
  padding-bottom: 20px;
}

.sparkle {
  color: #d9a044;
}

@media (max-width: 400px) {
  body {
    padding: 26px 14px;
  }

  .paper {
    padding: 36px 17px 32px;
  }

  .paper::before,
  .paper::after {
    width: 65px;
    height: 20px;
  }

  .subtitle {
    margin-bottom: 32px;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="cookie">🥠</div>

  <h1>Your Fortune Cookie</h1>

  <p class="subtitle">
    A little message from the universe <span class="sparkle">✨</span>
  </p>

  <section class="paper" aria-live="polite">
    <p id="fortune">Your next adventure is closer than you think.</p>
    <p class="lucky" id="numbers">Lucky Numbers 3, 11, 18, 27, 35, 42</p>
  </section>

  <button onclick="newFortune()">
    🥠 &nbsp; OPEN ANOTHER COOKIE
  </button>

  <div class="divider">♡</div>

  <p class="footer">
    <span class="sparkle">✦</span>
    Take what inspires you<br>
    and share a little kindness.
    <span class="sparkle">✦</span>
  </p>

</main>

<script>
const fortunes = [
  "Your dreams are never silly; depend on them to guide you.",
  "A little kindness can change someone's whole day.",
  "Your future holds a beautiful surprise.",
  "Believe in yourself, especially on difficult days.",
  "Small steps can lead to wonderful places.",
  "Something good is quietly finding its way to you.",
  "Your courage will open an unexpected door.",
  "The best adventures begin with a curious heart.",
  "Trust the timing of your own journey.",
  "A new friendship may bring unexpected happiness.",
  "Your kindness will return to you in surprising ways.",
  "Make room for the things that make you smile.",
  "You are closer to your goal than you realise.",
  "Today is a lovely day to begin again.",
  "A little patience will bring a clearer answer.",
  "Your imagination is one of your greatest gifts.",
  "The right opportunity may arrive in a small package.",
  "Let your heart be brave enough to try.",
  "Happiness often hides in the simplest moments.",
  "You have more strength than you know.",
  "A positive thought can brighten a cloudy day.",
  "Follow the path that makes you feel alive.",
  "Someone appreciates you more than you realise.",
  "A fresh start can begin at any moment.",
  "Your next chapter may be your favourite one.",
  "Be proud of how far you have already come.",
  "Good things grow when you give them time.",
  "An unexpected moment will make you smile.",
  "Your uniqueness is your quiet superpower.",
  "Choose hope, even when the road feels long.",
  "A little adventure will refresh your spirit.",
  "Your efforts are building something wonderful.",
  "Listen closely; inspiration is all around you.",
  "The smallest step forward still counts.",
  "You deserve the same kindness you give others.",
  "A wonderful memory is waiting to be made.",
  "Let go of what no longer helps you grow.",
  "Your next idea could be your best one yet.",
  "Be open to happiness in unexpected places.",
  "The world is brighter with your kindness in it.",
  "A brave choice will bring you new possibilities.",
  "Give yourself permission to enjoy the moment.",
  "You are allowed to grow at your own pace.",
  "A little laughter will make today better.",
  "Your persistence will lead to progress.",
  "Beautiful things often begin with a simple yes.",
  "The universe has more surprises in store for you.",
  "Share your light; it may be exactly what someone needs.",
  "Today holds a reason to be grateful.",
  "Your kindness today will return to you threefold."
];

function newFortune() {
  const index = Math.floor(Math.random() * fortunes.length);
  document.getElementById("fortune").textContent = fortunes[index];

  const nums = [];
  while (nums.length < 6) {
    const n = Math.floor(Math.random() * 49) + 1;
    if (!nums.includes(n)) nums.push(n);
  }

  document.getElementById("numbers").textContent =
    "Lucky Numbers " + nums.join(", ");
}

newFortune();
</script>
</body>
</html>
